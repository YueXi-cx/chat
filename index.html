<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>角色扮演助手</title>
<style>
:root {
  --bg: #11111a;
  --bg-elev: #17172a;
  --bg-panel: #1c1c31;
  --border: #2a2a45;
  --text: #e9e9f2;
  --text-dim: #9a9ab5;
  --accent: #6c5ce7;
  --accent-2: #9b8cff;
  --user: #4b4b78;
  --ai: #1e1e35;
  --danger: #ff6b6b;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
.hidden { display: none !important; }

#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--bg-elev);
  flex-shrink: 0;
}
.title { font-weight: 700; font-size: 16px; }
.actions { display: flex; gap: 8px; }
.ghost-btn {
  border: 1px solid var(--border); background: transparent; color: var(--text-dim);
  border-radius: 10px; padding: 6px 12px; font-size: 13px; cursor: pointer; font-family: inherit;
}
.ghost-btn:hover { color: var(--text); border-color: var(--accent); }

.chat { flex: 1; overflow-y: auto; padding: 16px 12px; }

.empty {
  margin: 60px auto 0; text-align: center; color: var(--text-dim);
  font-size: 15px; line-height: 2; max-width: 320px; padding: 20px;
}

.msg { display: flex; flex-direction: column; margin: 8px 0; }
.msg.user { align-items: flex-end; }
.msg.ai { align-items: flex-start; }
.bubble {
  max-width: 86%; padding: 10px 14px; border-radius: 14px;
  line-height: 1.65; white-space: pre-wrap; word-break: break-word; font-size: 15px;
}
.msg.user .bubble { background: var(--user); border-bottom-right-radius: 4px; }
.msg.ai .bubble { background: var(--ai); border-bottom-left-radius: 4px; }
.msg.user .bubble { cursor: pointer; }
.msg.user .bubble:hover { filter: brightness(1.12); }
.bubble.streaming::after {
  content: "▍"; margin-left: 1px; color: var(--accent-2);
  animation: blink 1s steps(1) infinite;
}
.bubble.error { background: rgba(255,107,107,.12); color: var(--danger); }
.bubble.stopped { opacity: .8; }
@keyframes blink { 50% { opacity: 0; } }

.msg-actions { display: flex; gap: 6px; margin-top: 4px; }
.msg-action {
  border: none; background: transparent; color: var(--text-dim);
  font-size: 12px; cursor: pointer; padding: 4px 10px; border-radius: 8px; font-family: inherit;
}
.msg-action:hover { color: var(--accent-2); background: rgba(108,92,231,.14); }
.msg-action.edit-ok { color: var(--accent-2); font-weight: 600; }

.edit-area {
  width: 86%; max-width: 86%; border: 1px solid var(--accent); background: var(--bg-panel);
  color: var(--text); border-radius: 12px; padding: 10px 12px; font-size: 15px;
  font-family: inherit; line-height: 1.5; resize: vertical; outline: none; min-height: 60px;
}
.edit-bar { display: flex; gap: 6px; margin-top: 4px; }

.bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin: 8px 0 2px; font-weight: 700; line-height: 1.4; }
.bubble h1 { font-size: 1.35em; }
.bubble h2 { font-size: 1.25em; }
.bubble h3 { font-size: 1.15em; }
.bubble h4 { font-size: 1em; }
.bubble pre { background: rgba(0,0,0,.35); padding: 8px 10px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; margin: 6px 0; font-size: 13px; }
.bubble code { background: rgba(255,255,255,.1); padding: 1px 5px; border-radius: 4px; font-size: 13px; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
.bubble pre code { background: none; padding: 0; }
.bubble ul, .bubble ol { margin: 4px 0; padding-left: 20px; }
.bubble li { margin: 2px 0; }
.bubble blockquote { margin: 4px 0; padding: 2px 0 2px 10px; border-left: 3px solid var(--accent); color: var(--text-dim); }

.summary-card {
  background: var(--bg-panel); border: 1px dashed var(--border); border-radius: 10px;
  padding: 8px 12px; margin: 8px 0; color: var(--text-dim); font-size: 13px;
}
.summary-card summary { cursor: pointer; user-select: none; }
.summary-text { margin-top: 6px; white-space: pre-wrap; line-height: 1.6; }

.composer {
  display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border); background: var(--bg-elev); flex-shrink: 0;
}
.composer textarea {
  flex: 1; resize: none; border: 1px solid var(--border); background: var(--bg-panel);
  color: var(--text); border-radius: 12px; padding: 12px 14px; font-size: 15px;
  font-family: inherit; line-height: 1.5; max-height: 160px; outline: none;
}
.composer textarea:focus { border-color: var(--accent); }
.composer textarea:disabled { opacity: .6; }
#btn-send {
  border: none; background: var(--accent); color: #fff; border-radius: 12px;
  height: 46px; padding: 0 20px; font-size: 15px; cursor: pointer; flex-shrink: 0; font-family: inherit;
}
#btn-send:hover { background: var(--accent-2); }
#btn-send.stop { background: var(--danger); }

.settings { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; }
.settings-panel {
  width: 100%; max-height: 88vh; overflow-y: auto; background: var(--bg-elev);
  border-top: 1px solid var(--border); border-radius: 18px 18px 0 0; padding: 18px 16px;
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
}
.settings-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.settings-head span { font-weight: 700; font-size: 17px; }
.icon-btn { border: none; background: transparent; color: var(--text); font-size: 20px; cursor: pointer; padding: 4px 8px; }
.settings-panel label { display: block; margin-bottom: 13px; font-size: 13px; color: var(--text-dim); }
.settings-panel input, .settings-panel textarea {
  display: block; width: 100%; margin-top: 6px; border: 1px solid var(--border);
  background: var(--bg-panel); color: var(--text); border-radius: 10px; padding: 11px 12px;
  font-size: 14px; font-family: inherit; line-height: 1.5; outline: none;
}
.settings-panel textarea { resize: vertical; min-height: 70px; }
.settings-panel input:focus, .settings-panel textarea:focus { border-color: var(--accent); }
.temp-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.temp-row input[type="range"] {
  flex: 1; width: auto; padding: 0; margin: 0; border: none; background: transparent;
  accent-color: var(--accent);
}
#s-temp-val { min-width: 34px; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
.temp-hint { display: block; margin-top: 4px; font-size: 12px; color: var(--text-dim); line-height: 1.5; }
#btn-save {
  width: 100%; border: none; background: var(--accent); color: #fff; border-radius: 12px;
  padding: 13px; font-size: 16px; cursor: pointer; margin-top: 4px; font-family: inherit;
}
#btn-save:hover { background: var(--accent-2); }
.hint { color: var(--text-dim); font-size: 12px; text-align: center; margin: 12px 0 0; line-height: 1.6; }

#toast {
  position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(10px);
  background: var(--bg-panel); border: 1px solid var(--border); color: var(--text);
  padding: 10px 18px; border-radius: 20px; font-size: 14px; z-index: 100; opacity: 0;
  pointer-events: none; transition: opacity .2s, transform .2s; max-width: 86vw;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="title">💬 角色扮演助手</div>
    <div class="actions">
      <button id="btn-new" class="ghost-btn">清空</button>
      <button id="btn-settings" class="ghost-btn">⚙️ 设置</button>
    </div>
  </header>

  <div id="chat" class="chat"></div>

  <div class="composer">
    <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="btn-send">发送</button>
  </div>
</div>

<div id="settings" class="settings hidden">
  <div class="settings-panel">
    <div class="settings-head">
      <span>设置</span>
      <button id="btn-close" class="icon-btn">✕</button>
    </div>
    <label>接口地址 base_url
      <input id="s-base" type="url" placeholder="https://api.deepseek.com/v1" autocomplete="off">
    </label>
    <label>API Key
      <input id="s-key" type="password" placeholder="sk-..." autocomplete="off">
    </label>
    <label>模型名
      <input id="s-model" type="text" placeholder="deepseek-chat" autocomplete="off">
    </label>
    <label>角色扮演设定（想让它演谁就填谁）
      <textarea id="s-persona" rows="5" placeholder="例如：你扮演一个毒舌但心软的傲娇学姐，口嫌体正直，喜欢用「哼」「才不是呢」开头…"></textarea>
    </label>
    <label>温度 temperature
      <span class="temp-row">
        <input id="s-temp" type="range" min="0" max="2" step="0.1">
        <span id="s-temp-val">1.0</span>
      </span>
      <span class="temp-hint">越高越放得开（发散、惊喜、更野），越低越稳重（贴人设、克制、更乖）</span>
    </label>
    <button id="btn-save">保存</button>
    <p class="hint">API Key 只存在你本机浏览器，不上传任何服务器。<br>点自己的气泡可修改、AI 气泡下有「🔄 重新生成」；聊多了会自动整理成「提要」，记忆一直延续。</p>
  </div>
</div>

<script>
(function () {
  'use strict'

  var LS_SETTINGS = 'rp_settings'
  var LS_CHAT = 'rp_chat'
  var KEEP = 12          // 保留最近多少条原文
  var SUMMARIZE_AT = 24  // 超过多少条开始自动整理记忆

  function load(key, fallback) {
    try {
      var raw = localStorage.getItem(key)
      return raw ? JSON.parse(raw) : fallback
    } catch (e) { return fallback }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)) } catch (e) {}
  }

  var settings = load(LS_SETTINGS, { baseUrl: '', apiKey: '', model: '', persona: '', temperature: 1 })
  if (typeof settings.temperature !== 'number' || isNaN(settings.temperature)) settings.temperature = 1
  var chat = load(LS_CHAT, { summary: '', messages: [] })

  var streaming = false
  var summarizing = false
  var abortCtrl = null

  var $ = function (id) { return document.getElementById(id) }
  var chatEl = $('chat')
  var inputEl = $('input')
  var btnSend = $('btn-send')

  // ---------- 提示词 ----------
  function systemPrompt() {
    var p = '你是一个进行角色扮演的聊天智能体。'
    if (settings.persona) {
      p += '请始终以以下角色身份回应，保持角色的语气、性格、背景和记忆，不要跳出角色，不要提及自己是一个 AI。\n\n【角色设定】\n' + settings.persona
    } else {
      p += '你是一个友好、有帮助的聊天助手。'
    }
    return p
  }

  function buildMessages(msgs) {
    msgs = msgs || chat.messages
    var arr = [{ role: 'system', content: systemPrompt() }]
    if (chat.summary) {
      arr.push({ role: 'system', content: '【你们之前聊过的内容提要，请保持连贯一致，不要重复】\n' + chat.summary })
    }
    return arr.concat(msgs)
  }

  // ---------- 调用 API ----------
  function chatCompletionsUrl() {
    return settings.baseUrl.replace(/\/+$/, '') + '/chat/completions'
  }

  async function readErr(res) {
    var t = ''
    try { t = await res.text() } catch (e) {}
    try {
      var j = JSON.parse(t)
      return (j.error && j.error.message) || j.message || t || res.statusText
    } catch (e) { return t || res.statusText }
  }

  async function streamChat(messages, onDelta, signal) {
    var res = await fetch(chatCompletionsUrl(), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + settings.apiKey },
      body: JSON.stringify({ model: settings.model, messages: messages, stream: true, temperature: settings.temperature }),
      signal: signal
    })
    if (!res.ok) throw new Error('API ' + res.status + ': ' + (await readErr(res)))
    var reader = res.body.getReader()
    var decoder = new TextDecoder()
    var buf = ''
    while (true) {
      var r = await reader.read()
      if (r.done) break
      buf += decoder.decode(r.value, { stream: true })
      var nl
      while ((nl = buf.indexOf('\n')) >= 0) {
        var line = buf.slice(0, nl).trim()
        buf = buf.slice(nl + 1)
        if (line.indexOf('data:') !== 0) continue
        var data = line.slice(5).trim()
        if (data === '[DONE]') return
        try {
          var j = JSON.parse(data)
          var d = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content
          if (d) onDelta(d)
        } catch (e) {}
      }
    }
  }

  async function chatOnce(messages) {
    var res = await fetch(chatCompletionsUrl(), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + settings.apiKey },
      body: JSON.stringify({ model: settings.model, messages: messages, stream: false, temperature: 0.3 })
    })
    if (!res.ok) throw new Error('API ' + res.status + ': ' + (await readErr(res)))
    var j = await res.json()
    return (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || ''
  }

  // ---------- 渲染 ----------
  function msgEl(role, text, i) {
    var wrap = document.createElement('div')
    wrap.className = 'msg ' + (role === 'user' ? 'user' : 'ai')
    wrap.setAttribute('data-i', i)
    var b = document.createElement('div')
    b.className = 'bubble'
    b.innerHTML = markdownToHtml(text)
    wrap.appendChild(b)

    if (role === 'assistant') {
      var actions = document.createElement('div')
      actions.className = 'msg-actions'
      var rg = document.createElement('button')
      rg.className = 'msg-action'
      rg.textContent = '🔄 重新生成'
      rg.addEventListener('click', function () { regenerate(i) })
      actions.appendChild(rg)
      wrap.appendChild(actions)
    } else {
      b.addEventListener('click', function () { editUser(i, b) })
    }
    return wrap
  }

  // ---------- Markdown 渲染 ----------
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  }

  // 行内格式：**加粗**、*斜体*、_斜体_、`代码`、~~删除线~~
  function mdInline(text) {
    var codes = []
    var s = escapeHtml(text)
    // 先把行内代码抠出来保护，避免里面的 * _ 被误处理
    s = s.replace(/`([^`\n]+)`/g, function (m, c) {
      codes.push(c)
      return '\u0000' + (codes.length - 1) + '\u0000'
    })
    s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>')
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
    s = s.replace(/__([^_\n]+)__/g, '<strong>$1</strong>')
    s = s.replace(/(^|[^\w_])_([^_\n]+)_(?=[^\w_]|$)/g, function (m, pre, inner) {
      return pre + '<em>' + inner + '</em>'
    })
    s = s.replace(/~~([^~\n]+)~~/g, '<s>$1</s>')
    // 还原行内代码
    s = s.replace(/\u0000(\d+)\u0000/g, function (m, i) { return '<code>' + codes[+i] + '</code>' })
    return s
  }

  function markdownToHtml(text) {
    var lines = String(text).split('\n')
    var html = ''
    var inCode = false
    var codeBuf = []
    var inList = false
    var listTag = ''
    var lastPlain = false

    function closeList() {
      if (inList) { html += '</' + listTag + '>'; inList = false }
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i]

      // 围栏代码块 ```...```
      if (/^\s*```/.test(line)) {
        if (!inCode) { closeList(); inCode = true; codeBuf = [] }
        else { html += '<pre><code>' + escapeHtml(codeBuf.join('\n')) + '</code></pre>'; inCode = false; codeBuf = [] }
        lastPlain = false
        continue
      }
      if (inCode) { codeBuf.push(line); continue }

      // 标题
      var h = line.match(/^(#{1,4})\s+(.*)$/)
      if (h) { closeList(); html += '<h' + h[1].length + '>' + mdInline(h[2]) + '</h' + h[1].length + '>'; lastPlain = false; continue }

      // 引用
      if (/^\s*>\s?/.test(line)) { closeList(); html += '<blockquote>' + mdInline(line.replace(/^\s*>\s?/, '')) + '</blockquote>'; lastPlain = false; continue }

      // 无序列表
      var ul = line.match(/^\s*[-*]\s+(.*)$/)
      if (ul) {
        if (!inList || listTag !== 'ul') { closeList(); html += '<ul>'; inList = true; listTag = 'ul' }
        html += '<li>' + mdInline(ul[1]) + '</li>'
        lastPlain = false
        continue
      }
      // 有序列表
      var ol = line.match(/^\s*\d+[.)]\s+(.*)$/)
      if (ol) {
        if (!inList || listTag !== 'ol') { closeList(); html += '<ol>'; inList = true; listTag = 'ol' }
        html += '<li>' + mdInline(ol[1]) + '</li>'
        lastPlain = false
        continue
      }

      // 普通行 / 空行
      closeList()
      var r = line.trim() ? mdInline(line) : '&nbsp;'
      html += (lastPlain ? '<br>' : '') + r
      lastPlain = true
    }
    closeList()
    if (inCode) html += '<pre><code>' + escapeHtml(codeBuf.join('\n')) + '</code></pre>'

    return html
  }

  function render() {
    chatEl.innerHTML = ''
    if (chat.summary) {
      var d = document.createElement('details')
      d.className = 'summary-card'
      var s = document.createElement('summary')
      s.textContent = '📜 之前的聊天提要'
      var p = document.createElement('div')
      p.className = 'summary-text'
      p.textContent = chat.summary
      d.appendChild(s); d.appendChild(p)
      chatEl.appendChild(d)
    }
    if (!chat.messages.length) {
      var e = document.createElement('div')
      e.className = 'empty'
      e.textContent = settings.apiKey
        ? '开始聊天吧！点自己的气泡可修改，AI 气泡下可「🔄 重新生成」'
        : '先点右上角「⚙️ 设置」配置接口（base_url + API Key + 模型），然后就能开始角色扮演聊天了'
      chatEl.appendChild(e)
    }
    chat.messages.forEach(function (m, i) { chatEl.appendChild(msgEl(m.role, m.content, i)) })
    scrollBottom(true)
  }

  function appendAssistant() {
    var wrap = document.createElement('div')
    wrap.className = 'msg ai'
    var b = document.createElement('div')
    b.className = 'bubble streaming'
    wrap.appendChild(b)
    chatEl.appendChild(wrap)
    scrollBottom(true)
    return b
  }

  function scrollBottom(force) {
    var near = chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 80
    if (force || near) chatEl.scrollTop = chatEl.scrollHeight
  }

  // ---------- 发送 ----------
  async function send() {
    var text = inputEl.value.trim()
    if (!text || streaming || summarizing) return
    if (!settings.baseUrl || !settings.apiKey || !settings.model) {
      openSettings()
      toast('请先填写接口地址、API Key 和模型名')
      return
    }

    chat.messages.push({ role: 'user', content: text })
    save(LS_CHAT, chat)
    inputEl.value = ''
    autoGrow()
    render()
    await streamInto(chat.messages, appendAssistant(), function (full) {
      chat.messages.push({ role: 'assistant', content: full })
      save(LS_CHAT, chat)
    })
  }

  // 生成一条 AI 回复，流式写入指定气泡；完成后用 apply(full) 落到数据里。
  // ctxMessages：要发给模型的上下文（不含 system/提要，由 buildMessages 补齐）。
  // 发送时 ctxMessages 是完整 chat.messages，apply 负责 push 新消息；
  // 重新生成/改消息时 ctxMessages 截到目标位置，apply 负责覆盖原消息内容。
  async function streamInto(ctxMessages, bubble, apply) {
    streaming = true
    updateComposer()
    var full = ''
    var ok = false
    abortCtrl = new AbortController()

    try {
      await streamChat(buildMessages(ctxMessages), function (d) {
        full += d
        bubble.textContent = full
        scrollBottom()
      }, abortCtrl.signal)
      apply(full)
      ok = true
    } catch (e) {
      if (e && e.name === 'AbortError') {
        if (full) apply(full)
        bubble.classList.add('stopped')
        bubble.textContent = full ? full + '\n\n（已停止）' : '（已停止）'
      } else {
        bubble.classList.add('error')
        bubble.textContent = '出错了：' + (e && e.message ? e.message : e)
      }
    } finally {
      streaming = false
      bubble.classList.remove('streaming')
      updateComposer()
    }

    if (ok) {
      bubble.innerHTML = markdownToHtml(full)
      await summarize()
    }
  }

  // ---------- 重新生成 / 修改消息 ----------
  // 重新生成第 i 条 AI 回复：丢掉这条及之后的所有内容，从这条重新开始
  function regenerate(i) {
    if (streaming || summarizing) return
    var m = chat.messages[i]
    if (!m || m.role !== 'assistant') return
    chat.messages = chat.messages.slice(0, i)
    save(LS_CHAT, chat)
    render()
    streamInto(chat.messages, appendAssistant(), function (full) {
      chat.messages.push({ role: 'assistant', content: full })
      save(LS_CHAT, chat)
    })
  }

  // 点自己的气泡 → 原地编辑；确认后丢掉这条之后的所有内容，从这条重新生成
  function editUser(i, bubbleEl) {
    if (streaming || summarizing) return
    var m = chat.messages[i]
    if (!m || m.role !== 'user') return

    var wrap = bubbleEl.parentNode
    var ta = document.createElement('textarea')
    ta.className = 'edit-area'
    ta.value = m.content
    var bar = document.createElement('div')
    bar.className = 'edit-bar'
    var cancel = document.createElement('button')
    cancel.className = 'msg-action'
    cancel.textContent = '取消'
    var ok = document.createElement('button')
    ok.className = 'msg-action edit-ok'
    ok.textContent = '确认并重新生成'
    bar.appendChild(cancel); bar.appendChild(ok)

    wrap.replaceChild(ta, bubbleEl)
    wrap.appendChild(bar)
    ta.focus()
    ta.setSelectionRange(ta.value.length, ta.value.length)

    function finish(canceled) {
      var newText = ta.value.trim()
      if (canceled || !newText) { render(); return }
      m.content = newText
      chat.messages = chat.messages.slice(0, i + 1) // 丢掉这条之后的所有内容，从这条重新生成
      save(LS_CHAT, chat)
      render()
      streamInto(chat.messages, appendAssistant(), function (full) {
        chat.messages.push({ role: 'assistant', content: full })
        save(LS_CHAT, chat)
      })
    }
    cancel.addEventListener('click', function () { finish(true) })
    ok.addEventListener('click', function () { finish(false) })
    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); finish(false) }
      else if (e.key === 'Escape') { finish(true) }
    })
  }

  // ---------- 长记忆：自动整理 ----------
  function summaryPrompt(existing, oldMessages) {
    var text = oldMessages.map(function (m) {
      return (m.role === 'user' ? '用户' : 'AI') + '：' + m.content
    }).join('\n')
    var p = '请把下面这段对话压缩成简洁的内容提要，用第三人称叙述，保留关键信息、人物状态、剧情走向和情感关系，去掉寒暄和重复，控制在 200 字以内。\n\n'
    if (existing) p += '【已有的内容提要】\n' + existing + '\n\n'
    p += '【新增对话】\n' + text + '\n\n请直接输出更新后的完整内容提要（不要任何解释或标题）：'
    return p
  }

  async function summarize() {
    if (chat.messages.length <= SUMMARIZE_AT) return
    summarizing = true
    updateComposer()
    try {
      var toDrop = chat.messages.slice(0, chat.messages.length - KEEP)
      var kept = chat.messages.slice(-KEEP)
      var prompt = summaryPrompt(chat.summary, toDrop)
      var s = await chatOnce([{ role: 'user', content: prompt }])
      if (s && s.trim()) {
        chat.summary = s.trim()
        chat.messages = kept
        save(LS_CHAT, chat)
        render()
        toast('已自动整理之前的聊天记录')
      }
    } catch (e) {
      console.warn('记忆整理失败，已跳过', e)
    } finally {
      summarizing = false
      updateComposer()
    }
  }

  // ---------- 设置 ----------
  function openSettings() {
    $('s-base').value = settings.baseUrl || ''
    $('s-key').value = settings.apiKey || ''
    $('s-model').value = settings.model || ''
    $('s-persona').value = settings.persona || ''
    $('s-temp').value = settings.temperature
    $('s-temp-val').textContent = Number(settings.temperature).toFixed(1)
    $('settings').classList.remove('hidden')
  }
  function closeSettings() { $('settings').classList.add('hidden') }
  function saveSettings() {
    settings.baseUrl = $('s-base').value.trim()
    settings.apiKey = $('s-key').value.trim()
    settings.model = $('s-model').value.trim()
    settings.persona = $('s-persona').value.trim()
    settings.temperature = parseFloat($('s-temp').value)
    save(LS_SETTINGS, settings)
    closeSettings()
    render()
    toast('设置已保存')
  }

  function newChat() {
    if (!confirm('清空当前聊天，重新开始？')) return
    chat = { summary: '', messages: [] }
    save(LS_CHAT, chat)
    render()
  }

  // ---------- 工具 ----------
  function updateComposer() {
    var busy = streaming || summarizing
    inputEl.disabled = busy
    if (streaming) { btnSend.textContent = '停止'; btnSend.classList.add('stop') }
    else if (summarizing) { btnSend.textContent = '整理中…'; btnSend.classList.add('stop') }
    else { btnSend.textContent = '发送'; btnSend.classList.remove('stop') }
  }
  function autoGrow() {
    inputEl.style.height = 'auto'
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px'
  }
  function abort() { if (abortCtrl) abortCtrl.abort() }

  var toastTimer = null
  function toast(msg) {
    var t = $('toast')
    if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t) }
    t.textContent = msg
    t.classList.add('show')
    clearTimeout(toastTimer)
    toastTimer = setTimeout(function () { t.classList.remove('show') }, 2200)
  }

  // ---------- 事件 ----------
  btnSend.addEventListener('click', function () { streaming ? abort() : send() })
  inputEl.addEventListener('input', autoGrow)
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send() }
  })
  $('btn-settings').addEventListener('click', openSettings)
  $('btn-close').addEventListener('click', closeSettings)
  $('btn-save').addEventListener('click', saveSettings)
  $('btn-new').addEventListener('click', newChat)
  $('s-temp').addEventListener('input', function () {
    $('s-temp-val').textContent = Number($('s-temp').value).toFixed(1)
  })

  render()
  updateComposer()
})()
</script>
</body>
</html>
